[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clueshelf-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.28,<1", "playwright>=1.64,<2", "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "numpy>=2,<3", "huggingface_hub>=1,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3", "yt-dlp==2026.10.26", "yt-dlp-ejs==0.8.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
# faster-whisper 1.2.1 still passes av.open(metadata_errors=...), removed in PyAV 19.
transcribe = ["faster-whisper==1.2.1", "av>=11,<19"]

[tool.setuptools.packages.find]
include = ["clueshelf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"clueshelf.evals" = ["golden/*.jsonl"]
