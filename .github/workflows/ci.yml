name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "outputs/**", "reports/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "outputs/**", "reports/**", "**/*.md"]

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Linux minutes are billed at 1x on private repositories; Windows runners cost 2x.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements-lock.txt
          python -m pip install --no-deps -e ./backend
      - name: Tests
        run: python -m pytest backend/tests -q
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: data/models/multilingual-e5-small
          key: e5-small-${{ hashFiles('backend/clueshelf/embeddings.py') }}
      - name: Download pinned embedding model
        run: python scripts/setup_search.py
      - name: Search quality gate
        run: python scripts/eval.py search --gate 0.8 --out ci-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-search
          path: ci-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
